[package]
name = "latch-crypto"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
openmls = { version = "=0.9.2" }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
tls_codec = { version = "=0.5.0", features = ["derive", "serde"] }

[dev-dependencies]
ed25519-dalek = "=2.2.0"

[profile.release]
opt-level = "s"
lto = false
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
