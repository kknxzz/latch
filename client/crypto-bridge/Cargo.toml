[package]
name = "latch-crypto"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
openmls = { version = "=0.9.2" }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
tls_codec = { version = "=0.5.0", features = ["derive", "serde"] }

[dev-dependencies]
ed25519-dalek = "=2.2.0"

[profile.release]
opt-level = "s"
lto = false
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

# Published provider 0.6.0 still resolves affected crypto-bigint and optional
# libcrux dependencies. Pin the official upstream dependency migrations without
# downgrading the released OpenMLS protocol implementation (0.9.2).
[patch.crates-io]
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }
openmls_basic_credential = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }
openmls_memory_storage = { git = "https://github.com/openmls/openmls", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }
# Upstream also migrated the cfg(hax)-only proof model from hax 0.3 to 0.4,
# removing the unmaintained proc-macro-error2 from the resolved lockfile.
core-models = { git = "https://github.com/cryspen/libcrux", rev = "124d5987726715cfe2ce8da52a3ad1f1a0a0fb1e" }
